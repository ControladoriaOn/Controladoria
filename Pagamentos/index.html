<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pagamentos · Dashboard</title>

<link rel="icon" type="image/png" href="../favicon.png?v=2">
<link rel="apple-touch-icon" href="../favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" role="presentation"></div>

<aside class="sidebar" id="sidebar" aria-label="Navegação principal">
  <div class="logo">
    <div class="logo-mark">
      <img src="../logo-mascote.jpg"
           alt="Mascote Controladoria"
           onerror="this.style.display='none'; this.parentNode.textContent='₣';">
    </div>
    <div class="logo-text">
      <span>Financeiro</span>
      <span>Pagamentos</span>
    </div>
  </div>
  <nav>
    <a href="#dashboard" class="active" data-spy-link>
      <i class="fa-solid fa-gauge-high"></i> Dashboard
    </a>
    <a href="#realizados" data-spy-link>
      <i class="fa-solid fa-check-double"></i> Pagamentos Realizados
    </a>
    <a href="#previsto" data-spy-link>
      <i class="fa-solid fa-calendar-day"></i> Prévia de Pagamentos
    </a>
    <a id="link-atualizar" href="atualizar.html" hidden>
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Atualizar
    </a>
  </nav>

  <div class="sidebar-summary" aria-label="Resumo rápido">
    <div class="ss-title"><i class="fa-solid fa-bolt" aria-hidden="true"></i> Resumo rápido</div>
    <div class="ss-item">
      <span class="ss-label">Pago hoje</span>
      <span class="ss-value" id="ss-pago">—</span>
    </div>
    <div class="ss-item">
      <span class="ss-label">Previsto amanhã</span>
      <span class="ss-value" id="ss-previsto">—</span>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-stamp" id="stamp" role="status" aria-live="polite">
      <span class="dot"></span>
      <div>
        <span class="stamp-label">Status</span>
        <span class="stamp-text" id="stamp-text">carregando…</span>
      </div>
    </div>
    <a id="btn-hub" class="btn-hub" href="../" rel="noopener" hidden>
      <i class="fa-solid fa-arrow-left-long"></i>
      Voltar ao Hub
    </a>
  </div>
</aside>

<div class="main-content">
  <header>
    <div class="header-left">
      <button class="hamburger" id="btnHamburger" type="button" aria-label="Abrir menu lateral" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 class="page-title">
        <i class="fa-solid fa-chart-line"></i>
        Pagamentos
      </h1>
    </div>
  </header>

  <div class="content-body" id="main-container">
    <!-- Esqueleto inicial (pré-JS). O app.js troca por um loading animado. -->
    <div class="dash-loading" id="initial-state">
      <div class="kpi-grid">
        <div class="kpi kpi-sk"><div class="sk-line sk-label"></div><div class="sk-line sk-value"></div><div class="sk-line sk-sub"></div></div>
        <div class="kpi kpi-sk"><div class="sk-line sk-label"></div><div class="sk-line sk-value"></div><div class="sk-line sk-sub"></div></div>
        <div class="kpi kpi-sk"><div class="sk-line sk-label"></div><div class="sk-line sk-value"></div><div class="sk-line sk-sub"></div></div>
        <div class="kpi kpi-sk"><div class="sk-line sk-label"></div><div class="sk-line sk-value"></div><div class="sk-line sk-sub"></div></div>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
