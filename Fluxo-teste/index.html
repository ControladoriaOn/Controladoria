<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fluxo de Caixa · On Time</title>

<link rel="icon" type="image/png" href="../favicon.png?v=2">
<link rel="apple-touch-icon" href="../favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

<!-- mesmo fundo vivo das outras ferramentas do hub -->
<div class="fundo" aria-hidden="true">
  <span class="brilho b1"></span>
  <span class="brilho b2"></span>
  <span class="brilho b3"></span>
  <span class="grao"></span>
</div>

<div class="fio" id="fio"><span id="fio-fill"></span></div>

<!-- o carregamento é a própria tabela se preenchendo -->
<div id="loader">
  <div class="load-palco">
    <div class="load-card">
      <div class="load-brilho" aria-hidden="true"></div>
      <div class="load-mascote">
        <div class="load-ring"></div>
        <img src="../logo-mascote.jpg" alt="" onerror="this.style.display='none'">
      </div>
      <div class="load-text" id="load-text">Lendo o fluxo…</div>
      <div class="load-barra"><span id="load-barra-fill"></span></div>
      <div class="load-pct" id="load-pct">0%</div>
    </div>
    <div class="esq-tabela" aria-hidden="true"></div>
  </div>
</div>

<header>
  <div class="marca">
    <div class="marca-icone">
      <img src="../logo-mascote.jpg" alt=""
           onerror="this.style.display='none'; this.parentNode.textContent='₣';">
    </div>
    <div class="marca-texto">
      <h1>Fluxo de Caixa</h1>
      <span id="headerData"></span>
    </div>
  </div>

  <div class="header-right">
    <div class="stamp" id="stamp" role="status" aria-live="polite">
      <span class="dot off"></span>
      <span class="stamp-text" id="stamp-text">carregando…</span>
    </div>
    <button class="btn btn-ghost" id="btnRecarregar" type="button" title="Recarregar">
      <i class="fa-solid fa-rotate"></i>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnDias" type="button" title="Mostrar ou esconder os dias sem movimento">
      <i class="fa-solid fa-calendar-week"></i> <span>Dias úteis</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btnCentavos" type="button" title="Alternar entre a visão compacta e a exata">
      <i class="fa-solid fa-coins"></i> <span>Centavos</span>
    </button>
    <button class="btn btn-primary" id="btnExportar" type="button">
      <i class="fa-solid fa-file-excel"></i> <span>Exportar</span>
    </button>
    <a id="btn-hub" class="btn btn-ghost" href="../" rel="noopener" hidden title="Voltar ao Hub">
      <i class="fa-solid fa-arrow-left-long"></i>
    </a>
  </div>
</header>

<main class="content" id="content"></main>

<!-- detalhe de uma célula: os títulos que formam aquele número -->
<div class="modal" id="modal-detalhe">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-solid fa-list-ul"></i> <span id="det-titulo">Detalhe</span></h3>
      <p id="det-sub"></p>
    </div>
    <div class="modal-body" id="det-corpo"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" type="button" data-fechar="modal-detalhe">Fechar</button>
    </div>
  </div>
</div>

<!-- digitação de uma linha manual -->
<div class="modal" id="modal-lanc">
  <div class="modal-box sm">
    <div class="modal-head">
      <h3><i class="fa-solid fa-pen"></i> <span id="lanc-titulo">Lançar</span></h3>
      <p id="lanc-sub"></p>
    </div>
    <div class="modal-body">
      <div class="campos">
        <div class="campo wide">
          <label>Valor</label>
          <input type="text" id="lanc-valor" inputmode="decimal" placeholder="0,00">
        </div>
        <div class="campo wide">
          <label>Observação (opcional)</label>
          <input type="text" id="lanc-desc" placeholder="de onde veio, para quem foi…">
        </div>
      </div>
      <div class="note info" id="lanc-nota" style="margin-top:14px" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" type="button" id="lanc-excluir" hidden>Excluir</button>
      <button class="btn btn-ghost" type="button" data-fechar="modal-lanc">Cancelar</button>
      <button class="btn btn-primary" type="button" id="lanc-salvar">Salvar</button>
    </div>
  </div>
</div>

<!-- posição de saldos do dia: todas as contas de uma vez, que é como se digita -->
<div class="modal" id="modal-saldos">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-solid fa-building-columns"></i> <span id="sal-titulo">Posição de saldos</span></h3>
      <p id="sal-sub"></p>
    </div>
    <div class="modal-body" id="sal-corpo"></div>
    <div class="modal-foot">
      <span class="sal-total" id="sal-total"></span>
      <button class="btn btn-ghost" type="button" data-fechar="modal-saldos">Cancelar</button>
      <button class="btn btn-primary" type="button" id="sal-salvar">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Numa pasta de teste, declare aqui a URL do script de teste. Em produção
     esta linha não existe, e a página usa a URL de produção sozinha:
     <script>window.URL_TESTE = 'https://script.google.com/macros/s/.../exec';</script> -->
<script src="fluxo.js"></script>
</body>
</html>
