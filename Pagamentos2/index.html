<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pagamentos · Painel</title>

<link rel="icon" type="image/png" href="../favicon.png?v=2">
<link rel="apple-touch-icon" href="../favicon.png?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

<div id="loader">
  <div class="load-mascote">
    <div class="load-ring"></div>
    <img src="../logo-mascote.jpg" alt="" onerror="this.style.display='none'">
  </div>
  <div class="load-logo">ON<span>TIME</span></div>
  <div class="load-text" id="load-text">Carregando pagamentos…</div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" role="presentation"></div>

<aside class="sidebar" id="sidebar" aria-label="Navegação principal">
  <div class="logo">
    <div class="logo-mark">
      <img src="../logo-mascote.jpg" alt="Mascote"
           onerror="this.style.display='none'; this.parentNode.textContent='₣';">
    </div>
    <div class="logo-text">
      <span>Financeiro</span>
      <span>Pagamentos</span>
    </div>
  </div>

  <nav id="nav"></nav>

  <div class="side-card">
    <div class="sc-title"><i class="fa-solid fa-bolt"></i> Resumo do dia</div>
    <div class="sc-item">
      <span class="sc-label">Já pago</span>
      <span class="sc-value" id="sc-pago">—</span>
    </div>
    <div class="sc-item">
      <span class="sc-label">Falta pagar</span>
      <span class="sc-value" id="sc-pagar">—</span>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="stamp" id="stamp" role="status" aria-live="polite">
      <span class="dot off"></span>
      <span class="stamp-text" id="stamp-text">carregando…</span>
    </div>
    <a id="link-atualizar" class="btn-hub" href="atualizar.html" hidden>
      <i class="fa-solid fa-arrow-up-from-bracket"></i> Atualizar base
    </a>
    <a id="btn-hub" class="btn-hub" href="../" rel="noopener" hidden
       style="background:transparent;border-color:rgba(255,255,255,.2);box-shadow:none">
      <i class="fa-solid fa-arrow-left-long"></i> Voltar ao Hub
    </a>
  </div>
</aside>

<div class="main" id="scroll">
  <header>
    <div class="header-left">
      <button class="hamburger" id="btnHamburger" type="button"
              aria-label="Abrir menu lateral" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 class="page-title"><i class="fa-solid fa-chart-line"></i> Pagamentos</h1>
    </div>
    <div class="header-right">
      <div class="date-pick">
        <i class="fa-solid fa-calendar-day"></i>
        <input type="date" id="dataRef" aria-label="Dia de referência">
      </div>
      <button class="btn btn-ghost" id="btnHoje" type="button">Hoje</button>
      <button class="btn btn-ghost" id="btnRecarregar" type="button" title="Recarregar dados">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button class="btn btn-ghost" id="btnCiot" type="button" hidden>
        <i class="fa-solid fa-truck-fast"></i> CIOT do dia
      </button>
      <button class="btn btn-primary" id="btnNovo" type="button" hidden>
        <i class="fa-solid fa-plus"></i> Novo título
      </button>
    </div>
  </header>

  <div class="content" id="content"></div>
</div>

<div class="modal" id="modalEdit">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fa-solid fa-pen-to-square"></i> <span id="me-titulo">Editar título</span></h3>
      <p id="me-sub"></p>
    </div>
    <div class="modal-body"><div class="campos" id="me-campos"></div></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="me-cancel" type="button">Cancelar</button>
      <button class="btn btn-danger" id="me-reset" type="button" hidden>
        <i class="fa-solid fa-rotate-left"></i> Desfazer edições
      </button>
      <button class="btn btn-primary" id="me-salvar" type="button">
        <i class="fa-solid fa-check"></i> Salvar
      </button>
    </div>
  </div>
</div>

<div class="modal" id="modalSenha">
  <div class="modal-box sm">
    <div class="modal-head">
      <h3><i class="fa-solid fa-lock"></i> Senha de edição</h3>
      <p>Pedida uma vez por aba. Fica só nesta sessão do navegador.</p>
    </div>
    <div class="modal-body">
      <div class="campos">
        <div class="campo wide">
          <label for="ms-nome">Seu nome</label>
          <input type="text" id="ms-nome" placeholder="quem está editando" autocomplete="name">
        </div>
        <div class="campo wide">
          <label for="ms-senha">Senha</label>
          <input type="password" id="ms-senha" autocomplete="current-password">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="ms-cancel" type="button">Cancelar</button>
      <button class="btn btn-primary" id="ms-ok" type="button">Entrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="conciliacao.js"></script>
<script src="app.js"></script>
</body>
</html>
